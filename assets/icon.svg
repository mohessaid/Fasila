<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2350"/>
      <stop offset="0.55" stop-color="#5B2A63"/>
      <stop offset="1" stop-color="#E0735A"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#sky)"/>
  <rect x="96" y="96" width="832" height="832" rx="176" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="6"/>
  <!-- the day dial: 270° arc -->
  <path d="M 300 712 A 300 300 0 1 1 724 712" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="44" stroke-linecap="round"/>
  <!-- the fasila: the highlighted gap to the next prayer -->
  <path d="M 512 212 A 300 300 0 0 1 789 396" fill="none" stroke="#FFD9A0" stroke-width="44" stroke-linecap="round"/>
  <circle cx="789" cy="396" r="40" fill="#FFF1C9"/>
  <!-- crescent -->
  <path d="M 560 420 A 130 130 0 1 0 560 640 A 104 104 0 1 1 560 420 Z" fill="#ffffff"/>
</svg>

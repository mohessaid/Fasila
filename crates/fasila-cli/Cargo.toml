[package]
name = "fasila-cli"
description = "Fasila on the command line: prayer times, Hijri dates and prayer-anchored schedules as JSON"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "fasila"
path = "src/main.rs"

[dependencies]
fasila-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }

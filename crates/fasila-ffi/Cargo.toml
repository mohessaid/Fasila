[package]
name = "fasila-ffi"
description = "UniFFI bindings exposing fasila-core to Swift (iOS/macOS) and Kotlin (Android)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "fasila_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
fasila-core = { workspace = true }
serde_json = { workspace = true }
uniffi = { version = "0.32", features = ["cli"] }
thiserror = "2"

[build-dependencies]
uniffi = { version = "0.32", features = ["build"] }

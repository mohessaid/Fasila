name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -p fasila-core -p fasila-ffi -p fasila-cli -- -D warnings
      - run: cargo test -p fasila-core -p fasila-ffi -p fasila-cli

  accuracy:
    name: Accuracy vs ephemeris
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install astropy adhanpy
      - run: cargo build -p fasila-core --example dump
      - name: Verify (fails if any event is off by more than 5 s)
        run: |
          python tools/verify/verify.py target/debug/examples/dump | tee verify.txt
          python - <<'PY'
          import re
          worst = float(re.search(r"WORST astronomical error: ([0-9.]+)", open("verify.txt").read()).group(1))
          assert worst <= 5.0, f"astronomical error {worst}s exceeds 5s"
          PY

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - working-directory: apps/desktop
        run: npm ci || npm install
      - working-directory: apps/desktop
        run: npm run check && npm run build
      - run: cargo clippy -p fasila-desktop -- -D warnings
      - working-directory: apps/desktop
        run: npx tauri build --ci
      - uses: actions/upload-artifact@v4
        with:
          name: fasila-desktop-${{ runner.os }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: ignore

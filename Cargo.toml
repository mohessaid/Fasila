[workspace]
resolver = "2"
members = ["crates/fasila-core", "crates/fasila-ffi", "crates/fasila-cli", "apps/desktop/src-tauri"]
default-members = ["crates/fasila-core", "crates/fasila-ffi", "crates/fasila-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/mohessaid/fasila"
authors = ["Fasila contributors"]

[workspace.dependencies]
fasila-core = { path = "crates/fasila-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true

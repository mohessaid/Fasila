# XcodeGen spec for the Apple clients of Fasila.
#   1. ../../scripts/build-apple.sh   (Rust → Generated/FasilaFFI.xcframework + fasila_ffi.swift)
#   2. xcodegen generate              (→ Fasila.xcodeproj)
name: Fasila

options:
  bundleIdPrefix: app.fasila
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your team here or in Xcode (Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEAD_CODE_STRIPPING: YES

# Sources shared by both apps.
fileGroups:
  - README.md

targets:
  Fasila-iOS:
    type: application
    platform: iOS
    sources: &appSources
      - path: Fasila
      - path: Generated/fasila_ffi.swift
        optional: true
        group: Generated
      - path: ../../data/cities.json
        buildPhase: resources
        group: SharedData
      - path: ../../data/hijri/announcements.json
        buildPhase: resources
        group: SharedData
      # Inter + Tajawal (OFL), shared with the Android app.
      - path: ../android/app/src/main/res/font
        buildPhase: resources
        group: Fonts
    dependencies:
      - framework: Generated/FasilaFFI.xcframework
        embed: false
      - target: FasilaWidget
        embed: true
    entitlements:
      path: Supporting/Fasila-iOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.fasila.shared
    info:
      path: Supporting/Info-iOS.plist
      properties:
        CFBundleDisplayName: Fasila
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar, fr]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocationWhenInUseUsageDescription: Fasila uses your location to compute prayer times and the Qibla direction. It never leaves your device.
        UIAppFonts: [inter_light.ttf, inter_regular.ttf, inter_medium.ttf, inter_semibold.ttf, inter_bold.ttf, tajawal_regular.ttf, tajawal_medium.ttf, tajawal_bold.ttf]
    settings:
      base:
        PRODUCT_NAME: Fasila
        PRODUCT_BUNDLE_IDENTIFIER: app.fasila
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  Fasila-macOS:
    type: application
    platform: macOS
    sources: *appSources
    dependencies:
      - framework: Generated/FasilaFFI.xcframework
        embed: false
    entitlements:
      path: Supporting/Fasila-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true # geocoding
        com.apple.security.personal-information.location: true
    info:
      path: Supporting/Info-macOS.plist
      properties:
        CFBundleDisplayName: Fasila
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar, fr]
        LSApplicationCategoryType: public.app-category.lifestyle
        ATSApplicationFontsPath: "."
        NSLocationUsageDescription: Fasila uses your location to compute prayer times and the Qibla direction. It never leaves your device.
        NSLocationWhenInUseUsageDescription: Fasila uses your location to compute prayer times and the Qibla direction. It never leaves your device.
    settings:
      base:
        PRODUCT_NAME: Fasila
        PRODUCT_BUNDLE_IDENTIFIER: app.fasila
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  FasilaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: FasilaWidget
      - path: Fasila/Shared
        group: FasilaWidget/Shared
      - path: Fasila/Resources/Localizable.xcstrings
        group: FasilaWidget/Shared
      - path: ../android/app/src/main/res/font
        buildPhase: resources
        group: Fonts
      - path: Generated/fasila_ffi.swift
        optional: true
        group: Generated
    dependencies:
      - framework: Generated/FasilaFFI.xcframework
        embed: false
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Supporting/FasilaWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.fasila.shared
    info:
      path: Supporting/Info-Widget.plist
      properties:
        CFBundleDisplayName: Fasila
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts: [inter_light.ttf, inter_regular.ttf, inter_medium.ttf, inter_semibold.ttf, inter_bold.ttf, tajawal_regular.ttf, tajawal_medium.ttf, tajawal_bold.ttf]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fasila.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

schemes:
  Fasila-iOS:
    build:
      targets:
        Fasila-iOS: all
    run:
      config: Debug
  Fasila-macOS:
    build:
      targets:
        Fasila-macOS: all
    run:
      config: Debug
